<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="logo-icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-eff" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="480" height="120" rx="24" fill="url(#logo-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Icon Squircle -->
  <g transform="translate(24, 20)">
    <rect width="80" height="80" rx="20" fill="url(#logo-icon-bg)" stroke="#334155" stroke-width="1.5" />
    <!-- Waveform equalizer bars -->
    <rect x="14" y="36" width="5" height="16" rx="2.5" fill="#10b981" />
    <rect x="23" y="24" width="5" height="34" rx="2.5" fill="#10b981" />
    <rect x="32" y="16" width="5" height="48" rx="2.5" fill="url(#logo-grad)" filter="url(#glow-eff)" />
    <rect x="41" y="28" width="5" height="28" rx="2.5" fill="#06b6d4" />
    <rect x="50" y="20" width="5" height="40" rx="2.5" fill="url(#logo-grad)" />
    <rect x="59" y="34" width="5" height="20" rx="2.5" fill="#8b5cf6" />
    <!-- Pulse dot -->
    <circle cx="52.5" cy="22" r="3.5" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(124, 38)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#ffffff">Song</tspan>
      <tspan fill="url(#logo-grad)">Spot</tspan>
    </text>
    <rect x="156" y="-22" width="62" height="20" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
    <text x="187" y="-8" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#c084fc" letter-spacing="1">LIVE</text>
  </g>

  <text x="124" y="88" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Le Blind Test musical nouvelle génération · Solo &amp; Multijoueur
  </text>
</svg>
