<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Waveform bars forming dynamic equalizer & musical note -->
  <rect x="12" y="28" width="4" height="12" rx="2" fill="#10b981" />
  <rect x="18" y="20" width="4" height="24" rx="2" fill="#10b981" />
  <rect x="24" y="14" width="4" height="34" rx="2" fill="url(#glow)" />
  <rect x="30" y="24" width="4" height="20" rx="2" fill="#06b6d4" />
  <rect x="36" y="18" width="4" height="30" rx="2" fill="url(#glow)" />
  <rect x="42" y="26" width="4" height="16" rx="2" fill="#8b5cf6" />
  <rect x="48" y="30" width="4" height="10" rx="2" fill="#8b5cf6" />

  <!-- Center neon pulse dot -->
  <circle cx="38" cy="18" r="3" fill="#ffffff" />
</svg>
